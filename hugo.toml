baseURL = "https://arindambhattacharya.github.io/"
languageCode = "en-us"
title = "Arindam's Blog"
theme = "PaperMod"
paginate = 10

[params]
  author = "Arindam Bhattacharya"
  description = "Personal blog"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowToc = true

  [params.homeInfoParams]
    Title = "Hi, I'm Arindam"
    Content = "Welcome to my blog. I write about things I find interesting."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/arindambhattacharya"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 20
